<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Consignaciones Ansar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sticky header + tabs, month rail, single-column work area that widens to two columns on desktop. Patente chilena as the recurring identity mark. */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --sunk:#E3E9E6; --ink:#15201D; --muted:#596864; --line:#CFD8D4;
  --accent:#0D6656; --accent-soft:#D5EBE5; --on-accent:#FFFFFF;
  --warn:#A9530B; --warn-soft:#FBEBD9; --bad:#B2261B; --bad-soft:#FBE1DE; --good:#1D7539; --good-soft:#DDF1E3;
  --info:#3B57B5; --info-soft:#E1E7FA; --plum:#7A3E8F; --plum-soft:#F1E3F6;
  --plate-bg:#FFFFFF; --plate-ink:#111111;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#16201D; --sunk:#1D2925; --ink:#E4ECE9; --muted:#93A49F; --line:#2B3833;
  --accent:#43B79F; --accent-soft:#183A33; --on-accent:#05211B;
  --warn:#EDA25A; --warn-soft:#3A2814; --bad:#F27B6C; --bad-soft:#3D1C18; --good:#62C887; --good-soft:#163522;
  --info:#8EA6F2; --info-soft:#1D2646; --plum:#D29BE4; --plum-soft:#33203B;
  --plate-bg:#F3F3F0; --plate-ink:#111111; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#16201D; --sunk:#1D2925; --ink:#E4ECE9; --muted:#93A49F; --line:#2B3833;
  --accent:#43B79F; --accent-soft:#183A33; --on-accent:#05211B;
  --warn:#EDA25A; --warn-soft:#3A2814; --bad:#F27B6C; --bad-soft:#3D1C18; --good:#62C887; --good-soft:#163522;
  --info:#8EA6F2; --info-soft:#1D2646; --plum:#D29BE4; --plum-soft:#33203B;
  --plate-bg:#F3F3F0; --plate-ink:#111111; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;gap:12px;padding-block:12px 8px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;flex:1;min-width:180px}
.brand h1{font-size:26px;line-height:1}
.brand small{color:var(--muted);font-size:12.5px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:10px 12px;font-family:var(--f-display);font-size:18px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.err{background:var(--bad)}

/* Month rail */
.rail{display:flex;gap:6px;overflow-x:auto;padding-block:12px;scrollbar-width:thin}
.rail button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;white-space:nowrap}
.rail button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rail button .c{font-size:11.5px;opacity:.75;margin-left:4px}

main{padding-block:8px 80px;display:grid;gap:20px}
.banner{border-radius:var(--r);padding:12px 14px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);font-size:14px}
.banner.info{background:var(--info-soft);border-color:var(--info)}

/* Plate */
.plate{display:inline-flex;align-items:center;gap:6px;background:var(--plate-bg);color:var(--plate-ink);border:2px solid #1A1A1A;border-radius:5px;padding:1px 8px 0;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.08em;line-height:1.25;white-space:nowrap}
.plate::after{content:"CHILE";font-size:8px;letter-spacing:.12em;font-weight:600;opacity:.7;writing-mode:vertical-rl;transform:rotate(180deg)}
.plate.empty{color:#9a9a9a;border-style:dashed}

/* KPI */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:24px}
.sec-head p{margin:0;color:var(--muted);font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.kpi .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1.05}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.hl{border-color:var(--accent);background:var(--accent-soft)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;min-width:0}
.two{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:900px){.two{grid-template-columns:1.25fr 1fr}}

/* Bars */
.bars{display:grid;grid-template-columns:repeat(13,minmax(28px,1fr));gap:6px;align-items:end;height:170px;padding-top:18px}
.barcol{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;cursor:pointer;border-radius:6px;padding-bottom:2px}
.barcol.sel{background:var(--sunk)}
.barpair{display:flex;gap:2px;align-items:flex-end;height:120px;width:100%;justify-content:center}
.bar{width:42%;max-width:14px;border-radius:3px 3px 0 0;position:relative;min-height:2px}
.bar.in{background:var(--accent)} .bar.out{background:var(--warn)}
.bar span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--muted)}
.barcol .ml{font-size:11px;color:var(--muted);text-transform:capitalize}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.barwrap{overflow-x:auto}

/* Cards / list */
.list{display:grid;gap:8px}
.car{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;text-align:left;width:100%;position:relative;overflow:hidden}
.car:hover{border-color:var(--accent)}
.car::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sev,transparent)}
.car .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.car .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted)}
.car .right{text-align:right;font-weight:700;white-space:nowrap}
@media(max-width:520px){.car{grid-template-columns:auto 1fr}.car .right{grid-column:1/-1;text-align:left}}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.gap{background:var(--bad-soft);color:var(--bad)} .gap.m{background:var(--warn-soft);color:var(--warn)} .gap.ok{background:var(--good-soft);color:var(--good)}

.st-Tasación{background:var(--sunk);color:var(--muted)}
.st-Mandato-pendiente{background:var(--warn-soft);color:var(--warn)}
.st-En-preparación{background:var(--info-soft);color:var(--info)}
.st-Publicado{background:var(--accent-soft);color:var(--accent)}
.st-Con-oferta{background:var(--plum-soft);color:var(--plum)}
.st-Reservado{background:var(--plum-soft);color:var(--plum)}
.st-Vendido{background:var(--good-soft);color:var(--good)}
.st-Retirado{background:var(--sunk);color:var(--muted);text-decoration:line-through}

.alerts{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.alerts li button{width:100%;display:flex;gap:10px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 2px}
.alerts li:last-child button{border-bottom:0}
.alerts .why{font-size:13px;color:var(--muted);flex:1;min-width:0}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input[type=search],.filters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
.filters input[type=search]{flex:1 1 220px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Weeks */
.week{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;gap:0;overflow:hidden}
.week>header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;background:var(--sunk)}
.week h3{font-size:21px}
.week h3 small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted);margin-left:6px}
.wstats{display:flex;gap:6px;flex-wrap:wrap}
.wbody{display:grid;grid-template-columns:1fr;gap:14px;padding:14px}
@media(min-width:860px){.wbody{grid-template-columns:1fr 1fr}}
.wbody h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mini{display:grid;gap:6px}
.mini button{display:flex;gap:8px;align-items:center;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:left;font-size:13.5px}
.mini button .plate{font-size:15px}
.none{color:var(--muted);font-size:13.5px;font-style:italic}
.wform{display:grid;gap:8px}
.cur{color:var(--accent);font-weight:700}

/* Form */
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.field input:not([type=checkbox]),.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
.field textarea{min-height:68px;resize:vertical}
.field.miss input:not([type=checkbox]),.field.miss select,.field.miss textarea{border-color:var(--warn);background:var(--warn-soft)}
.field .hint{font-size:11.5px;color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;padding:6px 0}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.check.miss{color:var(--warn);font-weight:600}

.sheet{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;justify-content:flex-end}
.sheet .box{background:var(--bg);width:min(760px,100%);height:100%;overflow-y:auto;display:flex;flex-direction:column}
.sheet .bh{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);padding-block:calc(12px + env(safe-area-inset-top,0px)) 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sheet .bh h2{font-size:22px;flex:1;min-width:150px}
.sheet .bb{padding-block:14px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.fs{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.fs h3{font-size:18px;display:flex;justify-content:space-between;align-items:center}
.fs h3 .pill{font-family:var(--f-body)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.grid .wide{grid-column:1/-1}
.sheet .bf{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.sheet .bf .sp{flex:1}
.gapbox{background:var(--bad-soft);border:1px solid var(--bad);border-radius:var(--r);padding:10px 12px;font-size:13.5px}
.gapbox ul{margin:6px 0 0;padding-left:18px}
.gapbox.ok{background:var(--good-soft);border-color:var(--good)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;display:grid;gap:8px;justify-items:center}
.empty .plate{font-size:24px}
.empty p{margin:0;color:var(--muted);max-width:46ch}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:60;font-size:14px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0;text-align:left;width:100%;display:grid;overflow:hidden}
.tcard:hover{border-color:var(--accent)}
.tcard .th{display:flex;gap:10px;align-items:center;padding:12px 14px 8px;flex-wrap:wrap}
.tcard .th .nm{flex:1;min-width:140px;font-weight:700;line-height:1.25}
.tcard .th .nm small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.tcard .tp{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 14px;background:var(--accent-soft);border-block:1px solid var(--line)}
.tcard .tp .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--accent)}
.tcard .tp .v{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1;color:var(--ink)}
.tcard .tp.miss{background:var(--bad-soft)} .tcard .tp.miss .l,.tcard .tp.miss .v{color:var(--bad)} .tcard .tp.miss .v{font-size:20px}
.tcard dl{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:0;padding:12px 14px 14px}
.tcard dl div{min-width:0}
.tcard dt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tcard dd{margin:0;font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
.tcard dd.mute{color:var(--muted);font-weight:400;font-style:italic}
.tcard dl .full{grid-column:1/-1}
.mgp{background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.mgp dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 14px;margin:0}
.mgp dt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.mgp dd{margin:0;font-size:16px;font-weight:700}
.mgp dd.mute{font-size:13px;font-weight:400;font-style:italic;color:var(--muted)}
.mgp .hint{margin:0;font-size:12px;color:var(--muted)}
.cgroup{display:grid;gap:6px}
.cgroup .lbl,.field .lbl2{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.cgroup .chips button small{font-weight:500;opacity:.75}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.mbar{display:flex;align-items:center;gap:8px;min-width:120px}
.mbar i{display:block;height:8px;border-radius:4px;background:var(--accent);min-width:2px}
.mbar span{font-size:12.5px;color:var(--muted)}
.insights{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.crow{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.crow .cmain{flex:1;min-width:0;display:grid;gap:3px;background:none;border:0;text-align:left;padding:0}
.crow .cd{font-size:12.5px;color:var(--muted)}
.crow .ct{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12.5px;color:var(--muted)}
@media(max-width:520px){.crow{flex-wrap:wrap}}
.team{display:grid;gap:8px}
.team .row{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.team .row span{flex:1}
.guide{display:grid;gap:8px;font-size:14px}
.guide ol{margin:0;padding-left:20px;display:grid;gap:6px}
/* Radar */
.rbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end}
.rbar .field{min-width:180px}
.rlist{display:grid;gap:10px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:76px minmax(0,1fr);overflow:hidden}
.rcard.muted{opacity:.72}
.rrail{background:var(--sunk);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;text-align:center}
.rrail .sc{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:.9}
.rrail .rl{font-size:10.5px;color:var(--muted);margin-top:-4px}
.rdet{margin:0;font-size:12.5px;color:var(--muted)}
.rrail .bd{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:2px 5px}
.bd.hoy{background:var(--accent);color:var(--on-accent)} .bd.sem{background:var(--surface);color:var(--ink);border:1px solid var(--line)} .bd.tar{color:var(--muted);border:1px dashed var(--line)}
.rbody{padding:12px 14px;display:grid;gap:10px;min-width:0}
.rtop{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:space-between;align-items:flex-start}
.rtop h3{font-size:22px;line-height:1.05}
.rtop .vv{font-size:12.5px;color:var(--muted)}
.rmeta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.rprice{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.rprice .p{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1}
.rprice .vs{font-size:12.5px;color:var(--muted)}
.vs b.low{color:var(--good)} .vs b.high{color:var(--warn)}
.m-Comprar{background:var(--good-soft);color:var(--good)} .m-Consignar{background:var(--info-soft);color:var(--info)} .m-Retoma{background:var(--plum-soft);color:var(--plum)}
.rpc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:8px 16px;font-size:13.5px}
.rpc div{min-width:0}

/* ===== Tema estilo Apple (rama diseno-estilo-apple) =====

:root{

/* Gaps: what each car is missing, by severity */
function gaps(a){
  const g=[],t=hoy(),activo=ACTIVOS.includes(a.estado||"Tasación");
  const A=(x)=>g.push([x,"alta"]),M=(x)=>g.push([x,"media"]);
  if(!a.patente)A("Falta patente");
  else if(!/^([A-Z]{4}\d{2}|[A-Z]{2}\d{4})$/.test(String(a.patente).toUpperCase().replace(/[^A-Z0-9]/g,"")))M("Patente con formato raro: revisa");
  if(!a.propNombre)M("Falta nombre del propietario");
  if(!a.propTelefono)A("Falta contacto del propietario");
  if(!a.consentimiento)A("Sin consentimiento de uso de datos");
  if(!a.responsable)M("Sin responsable asignado");
  if(!a.km)M("Falta kilometraje");
  if(!a.anio)M("Falta año");
  if(!a.tasacion)M("Falta tasación");
  if(!a.precioToma)A("Falta precio de toma");
  if((a.estado&&a.estado!=="Tasación")&&!a.mandatoFirmado)A("Mandato sin firmar");
  if(a.mandatoFirmado&&!a.fechaMandato)M("Falta fecha de firma del mandato");
  if(!a.rangoMin||!a.rangoMax)A("Rango de precio no acordado");
  if(!a.danos&&!a.pinturas)M("Daños y pinturas sin informar");
  const faltan=DOCS.filter(([k])=>!a[k]).length;
  if(activo&&faltan)M(`Faltan ${faltan} de ${DOCS.length} documentos`);
  if(activo){
    if(!a.fechaProxima)A("Sin próxima acción con fecha");
    else if(a.fechaProxima<t)A(`Próxima acción vencida (${fmtD(a.fechaProxima)})`);
    if(a.mandatoFirmado&&a.vencMandato){const d=dias(t,a.vencMandato);if(d<0)A("Mandato vencido");else if(d<=7)M(`Mandato vence en ${d} día${d===1?"":"s"}`)}
    if(["Publicado"].includes(a.estado)&&!Number(a.ofertas)){const base=a.fechaPublicacion||a.fechaIngreso;if(base&&dias(base,t)>21)A(`${dias(base,t)} días publicado sin oferta`)}
  }
  if(a.estado==="Vendido"&&(!a.precioVenta||!a.fechaVenta))A("Venta sin precio o fecha");
  return g;
}

/* Weeks Monday to Sunday; a week belongs to the month where its Monday falls. The first tracked month (nov 2026) also absorbs its leading days. */
function weeksOf(mo){
  const first=new Date(mo.y,mo.m,1),last=new Date(mo.y,mo.m+1,0);
  const isFirst=mo.key===MONTHS[0].key;
  const base=isFirst?pd(INICIO):first;
  let mon=new Date(base);const off=(8-base.getDay())%7;mon.setDate(base.getDate()+off);
  const out=[];let i=1;
  while(mon<=last){const sun=new Date(mon);sun.setDate(mon.getDate()+6);
    const s=(i===1&&isFirst)?base:mon;
    out.push({n:i,key:mo.key+"-s"+i,from:ds(s),to:ds(sun)});i++;mon=new Date(mon);mon.setDate(mon.getDate()+7)}
  return out;
}

  return `<button type="button" class="tcard" data-open="${esc(a._id)}">
    <div class="th">${plate(a.patente)}<span class="nm">${esc(nombre(a))}<small>${[a.anio,a.color,a.combustible,a.transmision].filter(Boolean).map(esc).join(" · ")||"Faltan datos del vehículo"}</small></span><span class="pill ${cls(a.estado)}">${esc(a.estado||"Tasación")}</span></div>

      ${it("Rango acordado",rango)}

      ${it(ven?"Margen real":"Margen al publicado",tm&&ref?`<span style="color:${ref-tm>=0?"var(--good)":"var(--bad)"}">${clp(ref-tm)} · ${(Math.round((ref-tm)/ref*1000)/10).toLocaleString("es-CL")}%</span>`:"")}
      ${it("Margen al mínimo",tm&&a.rangoMin?`<span style="color:${a.rangoMin-tm>=0?"var(--good)":"var(--bad)"}">${clp(a.rangoMin-tm)}</span>`:"")}

function monthStats(mo){
  const ing=S.autos.filter(a=>inMonth(a.fechaIngreso,mo));
  const man=S.autos.filter(a=>a.mandatoFirmado&&inMonth(a.fechaMandato,mo));
  const ven=S.autos.filter(a=>a.estado==="Vendido"&&inMonth(a.fechaVenta,mo));
  const ret=S.autos.filter(a=>a.estado==="Retirado"&&inMonth(a.fechaRetiro||a.fechaProxima,mo));
  const com=ven.reduce((s,a)=>s+(Number(a.precioVenta)||0)*(Number(a.comision)||0)/100,0);
  const dv=ven.filter(a=>a.fechaIngreso&&a.fechaVenta).map(a=>dias(a.fechaIngreso,a.fechaVenta));
  return {ing,man,ven,ret,com,prom:dv.length?Math.round(dv.reduce((a,b)=>a+b,0)/dv.length):null};
}

/* ---------- Piloto Renta Diaria ---------- */
const PIL_BONO=4000,PIL_TOPE=30,PIL_COSTOS=280000,PIL_MARGEN_MIN=1400000,PIL_UTIL_MIN=1000000;
const PIL_DOC="https://claude.ai/artifact/Fh1jC3w1gdAXbwkThRmTwP";
const PIL_SEM=[{k:"base",l:"Base",from:"2026-11-02",to:"2026-11-15",prog:null},{k:"s1",l:"Semana 1",from:"2026-11-16",to:"2026-11-22",prog:true},{k:"s2",l:"Semana 2",from:"2026-11-23",to:"2026-11-29",prog:false},{k:"s3",l:"Semana 3",from:"2026-11-30",to:"2026-12-06",prog:true},{k:"s4",l:"Semana 4",from:"2026-12-07",to:"2026-12-13",prog:false}];
const PIL_ETAPAS=["Captación","Mandato","Publicación","Venta activa","Día 21","Día 30","Cierre","Otro"];
const PIL_EST=[["Nuevo","st-Mandato-pendiente"],["En análisis","st-En-preparación"],["Incorporado","st-Vendido"],["Descartado","st-Retirado"]];
const pilMargen=a=>{const tm=Number(a.precioToma)||0,p=Number(a.precioPublicado)||Number(a.rangoMax)||0;return tm&&p?p-tm:null};
function pilBono(a){
  if(!a.rentaDiaria)return null;
  const ini=a.inicioBono||a.fechaPublicacion||a.fechaIngreso;if(!ini)return null;
  const fin=a.estado==="Vendido"&&a.fechaVenta?a.fechaVenta:a.estado==="Retirado"?(a.fechaRetiro||hoy()):hoy();
  const dia=Math.max(0,dias(ini,fin)+1);
  return {ini,dia,bono:Math.min(PIL_TOPE,dia)*PIL_BONO};
}
function pilNeto(a){const pv=Number(a.precioVenta)||0,tm=Number(a.precioToma)||0;if(!pv||!tm)return null;const b=pilBono(a);return pv-tm-(b?b.bono:0)-PIL_COSTOS}
function vPiloto(){
  const t=hoy(),sem=PIL_SEM.find(w=>t>=w.from&&t<=w.to);
  const fase=t<"2026-11-16"?{txt:"Preparación · el programa parte el lunes 16 de noviembre",cls:"st-Mandato-pendiente"}
    :t>"2026-12-13"?{txt:"Piloto terminado · toca la revisión y la decisión",cls:"st-Con-oferta"}
    :sem&&sem.prog?{txt:`${sem.l} · se ofrece el programa a toda tasación que pase el filtro`,cls:"st-Vendido"}
    :{txt:`${sem?sem.l:""} · semana sin programa: consignación normal`,cls:"st-Tasación"};
  const enProg=S.autos.filter(a=>a.rentaDiaria&&ACTIVOS.includes(a.estado||"Tasación")).map(a=>({a,b:pilBono(a),m:pilMargen(a)})).sort((x,y)=>(y.b?y.b.dia:0)-(x.b?x.b.dia:0));
  const viernes=new Date().getDay()===5;
  const hito=x=>{const d=x.b?x.b.dia:0,of=Number(x.a.ofertas);
    if(!x.b)return ["Falta fecha de inicio del bono","bad"];
    if(d>=PIL_TOPE)return ["Día 30: ofrecer salidas A, B o C","bad"];
    if(d>=21&&!of)return ["Día 21 sin oferta: llamar con la rebaja pactada","bad"];
    if(d>=18&&!of)return [`Día 21 en ${21-d} día${21-d===1?"":"s"}: preparar datos de mercado`,"warn"];
    if(viernes)return ["Hoy toca el reporte del viernes","warn"];
    return [`Faltan ${21-d} días para el control del día 21`,"ok"]};
  const alertasN=enProg.filter(x=>hito(x)[1]==="bad").length;
  const bajoMin=enProg.filter(x=>x.m!==null&&x.m<PIL_MARGEN_MIN).length;
  const bonoComprometido=enProg.reduce((s,x)=>s+(x.b?x.b.bono:0),0);

  const filas=PIL_SEM.map(w=>{
    const tas=S.autos.filter(a=>inRange(a.fechaIngreso,w)),man=S.autos.filter(a=>a.mandatoFirmado&&inRange(a.fechaMandato,w)),ven=S.autos.filter(a=>a.estado==="Vendido"&&inRange(a.fechaVenta,w));
    const ofrecidos=tas.filter(a=>a.rentaDiaria).length;
    const bonoPag=ven.reduce((s,a)=>{const b=pilBono(a);return s+(b?b.bono:0)},0);
    const netos=ven.map(pilNeto).filter(x=>x!==null);
    const ret=S.autos.filter(a=>a.estado==="Retirado"&&inRange(a.fechaRetiro,w)).length;
    return {w,tas:tas.length,ofrecidos,man:man.length,tasa:tas.length?Math.round(man.length/tas.length*100):null,ven:ven.length,bonoPag,neto:netos.length?Math.round(netos.reduce((x,y)=>x+y,0)/netos.length):null,ret,cur:sem&&sem.k===w.k};
  });
  const agg=prog=>{const r=filas.filter(f=>f.w.prog===prog),T=r.reduce((s,f)=>s+f.tas,0),M=r.reduce((s,f)=>s+f.man,0);return {T,M,tasa:T?Math.round(M/T*100):null}};
  const con=agg(true),sin=agg(false),base=filas[0];

function rendLoad(force){
  if(S.rendBusy||(!force&&S.rend&&Date.now()-S.rend.at<120000))return;S.rendBusy=true;
  const d=pd(hoy());d.setDate(d.getDate()-27);const desde=d.toISOString().slice(0,10);
  fetch("/api/actividad?desde="+desde,{credentials:"same-origin"}).then(r=>r.json()).then(j=>{S.rend={at:Date.now(),filas:j.filas||[]};S.rendBusy=false;safeRender()}).catch(()=>{S.rendBusy=false});
}
function rendHtml(){
  rendLoad(false);
  const sem=S.rendSem||0,t=hoy(),lun0=(()=>{const d=pd(t);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w-7*sem);return d})();
  const ini=lun0.toISOString().slice(0,10),fin=sgPlus(ini,6);
  const filas=(S.rend?S.rend.filas:[]).filter(f=>f.dia>=ini&&f.dia<=fin);
  const calls=(S.segCalls&&S.segCalls.length?S.segCalls:S.llamadas||[]).filter(c=>(c.fecha||"")>=ini&&(c.fecha||"")<=fin);
  const rad=S.radarMap||{};
  const per=new Map();
  filas.forEach(f=>{const n=f.nombre||f.email;const o=per.get(n)||{n,min:0,dias:new Set(),jor:0,cont:0,tas:0,man:0,ges:[]};o.min+=f.minutos;o.dias.add(f.dia);const [h1,m1]=f.desde.split(":").map(Number),[h2,m2]=f.hasta.split(":").map(Number);o.jor+=Math.max(1,(h2*60+m2)-(h1*60+m1)+1);per.set(n,o)});
  calls.forEach(c=>{const n=c.consignador;if(!n)return;const o=per.get(n)||{n,min:0,dias:new Set(),jor:0,cont:0,tas:0,man:0,ges:[]};const v=sgNiv(c);o.cont++;if(v>=3)o.tas++;if(v>=5)o.man++;
    const r=c.radarId&&rad[c.radarId];if(r&&r.asignadoEn&&c.creadoEn){const g=(new Date(c.creadoEn)-new Date(r.asignadoEn))/60000;if(g>0&&g<240)o.ges.push(g)}per.set(n,o)});
  const med=a=>{if(!a.length)return null;const b=a.slice().sort((x,y)=>x-y);return b[Math.floor(b.length/2)]};
  const rows=[...per.values()].map(o=>{const h=o.min/60;return {...o,h,act:o.jor?Math.round(o.min/o.jor*100):null,tph:h?o.tas/h:null,mph:h?o.man/h:null,mpt:o.tas&&o.min?Math.round(o.min/o.tas):null,idx:h?(o.tas+3*o.man)/h:null,ges:med(o.ges)}}).sort((a,b)=>(b.idx??-1)-(a.idx??-1));
  const f1=x=>x==null?"—":x.toLocaleString("es-CL",{maximumFractionDigits:2});
  const tot=rows.reduce((a,o)=>({h:a.h+o.h,tas:a.tas+o.tas,man:a.man+o.man}),{h:0,tas:0,man:0});
  return `<section class="panel" style="margin-top:16px"><div class="sec-head"><h2>Rendimiento por hora activa <span style="vertical-align:middle;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)">PRUEBA</span></h2><p>Solo tú lo ves. Hora activa = minutos con el tablero visible y uso en los últimos 2 min. Las conversiones salen de Llamadas.</p></div>
  <div class="chips">${[0,1,2,3].map(i=>`<button type="button" data-rsem="${i}" aria-pressed="${sem===i}">${i===0?"Esta semana":i===1?"Semana pasada":"Hace "+i+" semanas"}</button>`).join("")}<button type="button" data-rref="1">↻</button></div>
  ${!S.rend?`<p class="none">Cargando actividad…</p>`:rows.length?`<div class="tbl"><table><thead><tr><th>Persona</th><th>Horas activas</th><th>% jornada activa</th><th>Contactos</th><th>Tasaciones</th><th>Mandatos</th><th>Tasaciones / hora</th><th>Min. por tasación</th><th>Min. por gestión</th><th>Índice de piso</th></tr></thead><tbody>
  ${rows.map(o=>`<tr><td>${esc(o.n)}${o.tas<10?' <small style="color:var(--muted)">(muestra chica)</small>':""}</td><td class="num">${f1(o.h)}</td><td class="num">${o.act==null?"—":o.act+"%"}</td><td class="num">${o.cont}</td><td class="num">${o.tas}</td><td class="num">${o.man}</td><td class="num"><b>${f1(o.tph)}</b></td><td class="num">${o.mpt??"—"}</td><td class="num">${o.ges==null?"—":Math.round(o.ges)}</td><td class="num"><b>${f1(o.idx)}</b></td></tr>`).join("")}
  </tbody><tfoot><tr><th>Equipo</th><td class="num">${f1(tot.h)}</td><td></td><td></td><td class="num">${tot.tas}</td><td class="num">${tot.man}</td><td class="num"><b>${f1(tot.h?tot.tas/tot.h:null)}</b></td><td></td><td></td><td class="num"><b>${f1(tot.h?(tot.tas+3*tot.man)/tot.h:null)}</b></td></tr></tfoot></table></div>`:`<p class="none">Sin actividad registrada en esta semana todavía. Se empieza a medir desde hoy, a medida que el equipo usa el sitio.</p>`}
  <p class="zfoot">Índice de piso = (tasaciones + 3 × mandatos) ÷ horas activas. Min. por gestión = mediana entre «Lo tomo» y el registro del resultado (solo avisos del Radar). Con menos de 10 tasaciones por persona, las diferencias pueden ser suerte. Avisa al equipo qué se mide y para qué.</p></section>`;
}

function parseVeh(v){
  v=String(v||"").replace(/\s+/g," ").trim();let anio="";const m=v.match(/\b(19[89]\d|20[0-4]\d)\b/);if(m){anio=m[1];v=v.replace(m[0]," ").replace(/\s+/g," ").trim()}
  if(!v)return {marca:"",modelo:"",anio};
  const mk=LISTS.marca().slice().sort((a,b)=>b.length-a.length).find(x=>lc(v)===lc(x)||lc(v).startsWith(lc(x)+" "));
  if(mk){const marca=catMarca(mk)||mk,rest=v.slice(mk.length).trim();const md=LISTS.modelo({marca}).slice().sort((x,y)=>y.length-x.length).find(x=>lc(rest)===lc(x)||lc(rest).startsWith(lc(x)+" "));return {marca,modelo:md?md+rest.slice(md.length):rest,anio}}
  for(const [b,ms] of Object.entries(CATALOGO)){const md=ms.slice().sort((a,c)=>c.length-a.length).find(x=>lc(v)===lc(x)||lc(v).startsWith(lc(x)+" "));if(md)return {marca:b,modelo:md+v.slice(md.length),anio}}
  const p=v.split(" ");return {marca:p[0],modelo:p.slice(1).join(" "),anio};

function parsePrecio(v){
  const s=String(v??"").trim().toLowerCase().replace(/\$/g,"").replace(/\s/g,"");if(!s)return "";
  const m=s.match(/^(\d{1,3}(?:[.,]\d{1,3})?)(m|mm|millones|mill)?$/);
  if(m){const n=Number(m[1].replace(",","."));if(m[2]||n<1000)return Math.round(n*1e6)}

/* ---------- Comparador por grupo (reemplaza las tablas sueltas) ---------- */
const CT_DIMS=[["consignador","Consignador"],["equipo","Equipo"],["fuente","Fuente"],["ruta","Ruta"],["perfil","Perfil"],["dia","Día"]];
const CT_COLS=[["n","Llamadas"],["cont","Contestan"],["int","Interés"],["agen","Tasaciones"],["mand","Mandatos"]];
const CT_MIN=10;
const ctRate=(r,k)=>k==="n"?r.n:(r.n?r[k]/r.n:0);
const ctScore=r=>r.n?(r.mand*10+r.agen)/r.n:0;
const ctFmt=(k,v)=>k==="n"?String(v):k==="cont"||k==="int"?Math.round(v*100)+"%":(Math.round(v*1000)/10).toLocaleString("es-CL");
function compPanel(sets,totBase,totArr){
  const dim=S.ctDim||lsGet("ansar_ctdim")||"consignador",sk=S.ctSort||"agen",dir=S.ctDir||-1;
  const dl=(CT_DIMS.find(d=>d[0]===dim)||CT_DIMS[0])[1];
  const tot=dim==="consignador"||dim==="equipo"?totBase:totArr;
  const rows=(sets[dim]||[]).slice();
  const avg={n:null,cont:tot.n?tot.cont/tot.n:0,int:tot.n?tot.int/tot.n:0,agen:tot.n?tot.agen/tot.n:0,mand:tot.n?tot.mand/tot.n:0};
  rows.sort((a,b)=>{
    if(sk==="k")return dim==="dia"?dir*(ORD_DIA.indexOf(b.k)-ORD_DIA.indexOf(a.k)):dir*String(b.k).localeCompare(String(a.k),"es");
    const ok=(b.n>=CT_MIN)-(a.n>=CT_MIN);if(sk!=="n"&&ok)return ok;
    return dir*(ctRate(a,sk)-ctRate(b,sk))||b.n-a.n;
  });
  const mx={};CT_COLS.forEach(([k])=>{mx[k]=Math.max(0,...rows.map(r=>ctRate(r,k)))});
  const ok=rows.filter(r=>r.n>=CT_MIN&&r.k!=="Sin dato");
  const avgS=ctScore(tot);
  const lead=ok.length>=2?ok.slice().sort((a,b)=>ctScore(b)-ctScore(a))[0]:null;
  const weak=ok.length>=2?ok.slice().sort((a,b)=>ctScore(a)-ctScore(b))[0]:null;
  const per100=(n,d)=>(Math.round((d?n/d:0)*1000)/10).toLocaleString("es-CL");
  const ins=[];let exp="";
  if(lead&&avgS&&ctScore(lead)>=avgS*1.2){
    ins.push(["up","Escalar",`<b style="color:var(--ink);text-transform:none;letter-spacing:0;font-size:14px">${esc(lead.k)}</b> trae ${per100(lead.agen,lead.n)} tasaciones y ${per100(lead.mand,lead.n)} mandatos por cada 100 llamadas, contra ${per100(tot.agen,tot.n)} y ${per100(tot.mand,tot.n)} del promedio.`]);
    exp=`Dar más horas a ${dl.toLowerCase()} ${lead.k} esta semana y medir tasaciones por cada 100 llamadas.`;
  }
  if(weak&&weak!==lead&&avgS&&ctScore(weak)<=avgS*0.8){
    ins.push(["dn","Corregir",`<b style="color:var(--ink);text-transform:none;letter-spacing:0;font-size:14px">${esc(weak.k)}</b> está bajo el promedio: ${per100(weak.agen,weak.n)} tasaciones por cada 100 y contesta el ${pct(weak.cont,weak.n)}%. Revisa guion, horario o calidad del dato.`]);
    if(!exp)exp=`Corregir ${dl.toLowerCase()} ${weak.k}: cambiar una sola cosa (guion u horario) y comparar tasaciones por cada 100 llamadas.`;
  }
  const chicos=rows.filter(r=>r.n<CT_MIN).length;
  if(!ins.length)ins.push(["","Falta muestra",ok.length<2?`Solo ${ok.length} grupo${ok.length===1?"":"s"} con ${CT_MIN} llamadas o más. Sigue registrando antes de mover horas: con menos, la diferencia puede ser suerte.`:`Ningún grupo se separa más de 20% del promedio. Mantén la mezcla y prueba un cambio a la vez.`]);
  S.ctExpText=exp;
  const wk=weeksOf(MONTHS[S.mes]).find(w=>hoy()>=w.from&&hoy()<=w.to),expAct=wk?(S.semanas[wk.key]||{}).experimento:"";
  const head=`<div class="ctr2 hd" role="row"><button type="button" class="cth" data-ctsort="k" aria-sort="${sk==="k"?(dir<0?"descending":"ascending"):"none"}">${esc(dl)}</button>${CT_COLS.map(([k,l])=>`<button type="button" class="cth" data-ctsort="${k}" aria-sort="${sk===k?(dir<0?"descending":"ascending"):"none"}">${l}${k==="agen"||k==="mand"?" /100":""}</button>`).join("")}<span class="cth" style="cursor:default">Embudo</span></div>`;
  const cell=(r,k)=>{
    const v=ctRate(r,k),low=r.n<CT_MIN,a=avg[k];
    let delta="",tone="";
    if(k!=="n"&&!low&&tot.n){const d=(v-a)*100;delta=Math.abs(d)<0.5?`<small class="ctd eq">= promedio</small>`:`<small class="ctd ${d>0?"up":"dn"}">${d>0?"▲":"▼"} ${Math.abs(Math.round(d*10)/10).toLocaleString("es-CL")} pts</small>`;
      tone=a>0&&v>=a*1.25?" hi":v<=a*0.75?" lo":""}
    return `<div class="ctc ct-${k}${tone}" data-l="${(CT_COLS.find(c=>c[0]===k)||[])[1]}"><span class="ctv num">${ctFmt(k,v)}${k==="agen"||k==="mand"?"<small> /100</small>":""}</span><span class="ctb"><i style="width:${mx[k]?v/mx[k]*100:0}%"></i></span>${delta}</div>`};
  const fun=r=>`<div class="ctf" data-l="Embudo" title="De ${r.n} llamadas: ${r.cont} contestan, ${r.int} interesados, ${r.agen} tasaciones, ${r.mand} mandatos">${[["f1",r.cont],["f2",r.int],["f3",r.agen],["f4",r.mand]].map(([c,n])=>`<i class="${c}" style="width:${r.n?Math.max(n?3:0,n/r.n*100):0}%"></i>`).join("")}</div>`;
  const conf=n=>n>=30?["c2","muestra sólida"]:n>=CT_MIN?["c1","muestra media"]:["c0","muestra chica"];
  const row=r=>{const c=conf(r.n);return `<div class="ctr2${r.n<CT_MIN?" low":""}" role="row"><div class="ctk"><b title="${esc(r.k)}">${esc(r.k)}</b><small><span class="ctconf ${c[0]}" aria-hidden="true"></span>${c[1]}</small></div>${CT_COLS.map(([k])=>cell(r,k)).join("")}${fun(r)}</div>`};
  const avgRow=tot.n?`<div class="ctr2 av" role="row"><div class="ctk"><b>Promedio</b><small>${tot.n} llamadas del período</small></div>${CT_COLS.map(([k])=>`<div class="ctc ct-${k}" data-l="${(CT_COLS.find(c=>c[0]===k)||[])[1]}"><span class="ctv num">${k==="n"?tot.n:ctFmt(k,avg[k])}${k==="agen"||k==="mand"?"<small> /100</small>":""}</span></div>`).join("")}${fun(tot)}</div>`:"";
  return `<div class="ct">
   <div class="ctbar"><div class="chips" role="group" aria-label="Comparar por">${CT_DIMS.map(([k,l])=>`<button type="button" data-ctdim="${k}" aria-pressed="${dim===k}">${l} <span class="num">${(sets[k]||[]).length}</span></button>`).join("")}</div>
    <label class="sgdl" for="ctsortsel">Ordenar por<select id="ctsortsel">${[["agen","Tasaciones por 100"],["mand","Mandatos por 100"],["int","Interés"],["cont","Contestan"],["n","Llamadas"],["k",dl]].map(([k,l])=>`<option value="${k}" ${sk===k?"selected":""}>${esc(l)}</option>`).join("")}</select></label></div>
   <div class="ctins">${ins.map(([c,t,x])=>`<div class="ctin ${c}"><b>${t}</b><span>${x}</span></div>`).join("")}${chicos?`<div class="ctin"><b>Muestra</b><span>${rows.length-chicos} de ${rows.length} grupos con ${CT_MIN} llamadas o más. Los atenuados aún no permiten conclusiones.</span></div>`:""}</div>
   ${exp&&S.canWrite&&wk?`<div class="ctexp"><span>${expAct?`Experimento actual de la semana ${wk.n}: <b>${esc(expAct)}</b>`:`Semana ${wk.n} sin experimento anotado.`}</span><button type="button" class="btn sm" data-ctexp="1">${expAct?"Reemplazar por la acción sugerida":"Anotar la acción sugerida como experimento"}</button></div>`:""}
   ${rows.length?`<div class="ctg" role="table" aria-label="Comparación por ${esc(dl.toLowerCase())}">${head}${rows.map(row).join("")}${avgRow}</div>`:`<p class="none">Sin llamadas en el período.</p>`}
   <div class="eleg"><span><i style="background:var(--info)"></i>Contestan</span><span><i style="background:var(--plum)"></i>Interés</span><span><i style="background:var(--warn)"></i>Tasaciones</span><span><i style="background:var(--good)"></i>Mandatos</span><span><span class="ctconf c2"></span> 30+ llamadas</span><span><span class="ctconf c1"></span> ${CT_MIN}–29</span><span><span class="ctconf c0"></span> menos de ${CT_MIN}</span></div>

  </div>`;
}
async function ctSaveExp(btn){
  if(!S.db||!S.ctExpText)return;
  const w=weeksOf(MONTHS[S.mes]).find(x=>hoy()>=x.from&&hoy()<=x.to);if(!w){toast("La semana actual no está en este mes");return}

  catch(e){btn.disabled=false;handleWriteErr(e)}
}
function statTable(title,col,rows){
  const maxR=Math.max(0.0001,...rows.map(r=>r.n?r.mand/r.n:0));
  return `<section class="panel"><h2 style="font-size:19px">${title}</h2>${rows.length?`<div class="tbl"><table><thead><tr><th>${col}</th><th>Llamadas</th><th>Contestan</th><th>Interesados</th><th>Agendan tasación</th><th>Mandatos</th><th>Mandatos por cada 100</th></tr></thead><tbody>${rows.map(r=>{const m100=r.n?Math.round(r.mand/r.n*1000)/10:0;
    return `<tr><td>${esc(r.k)}</td><td class="num">${r.n}</td><td class="num">${pct(r.cont,r.n)}%</td><td class="num">${r.int}</td><td class="num">${r.agen}</td><td class="num"><b>${r.mand}</b></td><td><div class="mbar"><i style="width:${r.n?(r.mand/r.n)/maxR*100:0}%"></i><span class="num">${m100.toLocaleString("es-CL")}</span></div></td></tr>`}).join("")}</tbody></table></div>`:`<p class="none">Sin llamadas en el período.</p>`}</section>`;
}

function vLlamadas(){

  const perEquipo=groupBy(base,equipoDe);if(F.equipo)base=base.filter(c=>equipoDe(c)===F.equipo);
  const arr=(F.cons?base.filter(c=>c.consignador===F.cons):base).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")||(b.creadoEn||"").localeCompare(a.creadoEn||""));

  const MIN=10;

  const desc=r=>`${r.mand} mandato${r.mand===1?"":"s"} y ${r.agen} tasaci${r.agen===1?"ón":"ones"} agendada${r.agen===1?"":"s"} en ${r.n} llamadas`;
  ins.push(bR?`<li>Ruta que más rinde: <b>${esc(bR.k)}</b> · ${desc(bR)}.</li>`:`<li>Ruta: faltan datos para comparar (mínimo ${MIN} llamadas por ruta).</li>`);

  ins.push(bF?`<li>Fuente que más convierte: <b>${esc(bF.k)}</b> · ${desc(bF)}.</li>`:`<li>Fuente: faltan datos para comparar (mínimo ${MIN} llamadas por fuente).</li>`);
  ins.push(bH?`<li>Día donde más contestan: <b>${esc(bH.k)}</b> · ${pct(bH.cont,bH.n)}% de ${bH.n} llamadas.</li>`:`<li>Día de la semana: faltan datos para comparar (mínimo ${MIN} llamadas por día).</li>`);
  const lvlCls=l=>l>=5?"st-Vendido":l>=3?"st-Publicado":l>=2?"st-En-preparación":l>=1?"st-Tasación":"st-Mandato-pendiente";
  const per100=(a,n)=>n?Math.round(a/n*1000)/10:0;
  const f1=x=>x.toLocaleString("es-CL");
  const noCont=arr.filter(c=>c.noContactar).length;

  /* Embudo */
  const pasos=[["Llamadas",st.n,"registradas"],["Contestan",st.cont,"contacto efectivo"],["Interesados",st.int,"quieren seguir"],["Agendan tasación",st.agen,"visita o tasación"],["Mandatos",st.mand,"firmados"]];
  const convs=pasos.map((p,i)=>i?(pasos[i-1][1]?p[1]/pasos[i-1][1]:null):null);
  let peor=-1;if(st.n>=MIN){let m=2;convs.forEach((c,i)=>{if(i&&c!==null&&c<m){m=c;peor=i}})}

    <div class="ptile z-res"><span class="pl">Mandatos</span><span class="pv num">${st.mand}</span><span class="ps">${f1(avgM)} por cada 100 llamadas</span></div>
  </div>
  ${vencidas||noCont?`<div class="fixes">${vencidas?`<span class="fix on"><b class="num">${vencidas}</b>con “volver a llamar” vencido</span>`:""}${noCont?`<span class="fix"><b class="num" style="color:var(--muted)">${noCont}</b>pidieron no ser contactados · no se llaman</span>`:""}</div>`:""}

  <div class="zgrid cz">

async function checkTel(){
  const box=$("#telInfo");if(!box||!S.db)return;const n=normTel(S.cf.telefono);
  if(n.length<8){box.innerHTML="";return}
  try{
    const snap=await S.db.collection("llamadas").where("telefonoN","==",n).get();
    const prev=snap.docs.map(d=>({...d.data(),_id:d.id})).filter(c=>c._id!==S.cfEdit).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
    const enAutos=S.autos.filter(a=>normTel(a.propTelefono)===n);
    const out=[];
    const nc=prev.find(c=>c.noContactar);
    if(nc)out.push(`<div class="banner" style="border-color:var(--bad);background:var(--bad-soft)"><b>No llamar.</b> Esta persona pidió no ser contactada (${fmtD(nc.fecha)}, ${esc(nc.consignador||"")}).</div>`);
    if(prev.length)out.push(`<div class="banner info">Ya se llamó ${prev.length} ${prev.length===1?"vez":"veces"}. Último: ${fmtD(prev[0].fecha)} · ${esc(prev[0].consignador||"")} · ${esc(prev[0].resultado||"")}.</div>`);
    if(enAutos.length)out.push(`<div class="banner info">Este teléfono ya está en Autos: ${enAutos.map(a=>esc(fmtPat(a.patente)||nombre(a))).join(", ")}.</div>`);
    box.innerHTML=out.join("");
  }catch(_){box.innerHTML=""}
}
async function saveCall(){
  if(!S.db){toast("Sin conexión a la base del equipo");return}
  const c=S.cf;

const sgKey=c=>c.radarId?"r:"+c.radarId:(c.telefonoN?"t:"+c.telefonoN:"c:"+c._id);
const sgId=k=>String(k).replace(/[^a-zA-Z0-9_-]/g,"_");

  return [...m.entries()].map(([k,cs])=>{

    const last=cs[cs.length-1],maxN=Math.max(0,...cs.map(sgNiv)),ln=sgNiv(last);

    const estado=maxN>=5?"ganado":(no||ln===1)?"perdido":maxN>=2?"activo":"frio";
    const fi=cs.find(c=>sgNiv(c)>=2);
    let trail=0;for(let i=cs.length-1;i>=0;i--){if(sgNiv(cs[i])===0)trail++;else break}
    const tc=[...cs].reverse().find(c=>normTel(c.telefono)),tel=tc?tc.telefono:(r&&r.telefono)||"",nc=[...cs].reverse().find(c=>(c.contacto||"").trim()),nom=nc?nc.contacto:(r&&r.contacto)||"";

  });

function sgScore(g){
  const t=hoy(),int={2:20,3:32,4:40}[g.etapa]||0,d=dias(g.last.fecha,t);
  const rap=d<=1?20:d<=2?14:d<=7?7:0;

  const cal=rc==null?12:Math.round(Math.max(0,Math.min(100,rc))/100*25);
  const fe=g.prox&&g.prox>=t?15:g.prox?5:0;
  const total=int+rap+cal+fe;
  return {total,label:total>=70?"CALIENTE":total>=45?"TIBIO":"FRÍO",det:`intención ${int}/40 · rapidez ${rap}/20 · calidad del aviso ${cal}/25${rc==null?" (sin rate)":""} · próxima fecha ${fe}/15`};
}
function sgRates(gs){
  const o={};[2,3,4].forEach(s=>{const res=gs.filter(g=>g.maxN>=s&&(g.estado==="ganado"||g.estado==="perdido"));const w=res.filter(g=>g.estado==="ganado").length;o[s]={n:res.length,w,p:(w+SG_PRIOR[s]*SG_K)/(res.length+SG_K)}});return o;
}
function sgProb(g,R){
  if(g.estado==="ganado")return 1;if(g.estado!=="activo")return 0;
  let p=R[g.etapa].p;const d=dias(g.last.fecha,hoy());
  if(d>14)p*=.35;else if(d>7)p*=.55;else if(d>2)p*=.8;
  if(g.prox&&g.prox<hoy())p*=.85;if(g.trail>=3)p*=.5;

function sgCad(g){

function sgPri(g){
  const t=hoy(),why=[];let p=0;
  if(g.etapa>=3&&g.prox===t){p=110;why.push("Tasación o visita hoy: confirma la hora")}
  else if(g.etapa>=3&&g.prox&&g.prox===sgPlus(t,1)){p=70;why.push("Tasación mañana: confirma hoy")}
  if(g.prox&&g.prox<t){const d=dias(g.prox,t);p=Math.max(p,100+Math.min(30,d));why.push(`Seguimiento vencido hace ${d} d`)}
  else if(g.prox===t&&p<80){p=Math.max(p,80);if(g.etapa<3)why.push("Toca hoy")}
  if(!g.prox){p=Math.max(p,90);why.push(g.etapa>=3?"Tasación sin fecha: fíjala":"Sin próxima fecha")}
  const d=dias(g.last.fecha,t);if(d>=2&&!(g.prox&&g.prox>t)){p=Math.max(p,60);why.push(`${d} días sin contacto`)}

function slots(){
  const out=[],d=new Date();let add=0;
  while(out.length<2&&add<10){add++;const x=new Date(d);x.setDate(d.getDate()+add);const w=x.getDay();if(w===0||w===6)continue;
    const lbl=add===1?`mañana ${DSEM[w]}`:`el ${DSEM[w]} ${x.getDate()}`;out.push(out.length===0?`${lbl} a las 11:00`:`${lbl} a las 17:30`)}
  return out;
}
function callSlot(){
  const d=new Date(),h=d.getHours();
  if(h<16)return `hoy a las ${h+2}:00`;
  let add=0;while(add<7){add++;const x=new Date(d);x.setDate(d.getDate()+add);const w=x.getDay();if(w!==0&&w!==6)return `${add===1?"mañana":"el"} ${DSEM[w]} a las 11:00`}
  return "mañana a las 11:00";
}
function pmState(r){
  const id=r._id;
  if(!S.pm[id]){const s=slots(),pct=Number(r.med)?Number(r.precio)/Number(r.med):0;
    S.pm[id]={tpl:rNivel(r)<0?"nocontesta":pct>1.02?"precio":"visita",nombre:r.contacto||"",motivo:"",h1:s[0]||"",h2:s[1]||"",hl:callSlot(),tel:r.telefono||"",comp:false,fin:false,com:false,custom:null}}
  return S.pm[id];
}

function collect(){
  const o={};
  FS.forEach(([,fs])=>fs.forEach(([k,,t])=>{const el=document.getElementById("f_"+k);if(!el)return;
    if(t==="check")o[k]=el.checked;
    else if(NUMK.has(k))o[k]=el.value===""?"":Number(el.value);
    else o[k]=el.value.trim()}));
  o.patente=String(o.patente||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  return o;
}

async function saveAuto(){
  if(!S.db){toast("Sin conexión a la base del equipo");return}
  const o=collect();
  if(!o.patente&&!o.marca&&!o.modelo){toast("Escribe al menos la patente o la marca y modelo");return}
  const dup=o.patente&&S.autos.find(a=>a.patente===o.patente&&a._id!==editing.id&&ACTIVOS.includes(a.estado||"Tasación"));
  if(dup){toast(`La patente ${fmtPat(o.patente)} ya está activa en la tabla`);return}
  if(o.estado==="Vendido"&&!o.fechaVenta)o.fechaVenta=hoy();
  if(o.estado==="Retirado"&&!o.fechaRetiro)o.fechaRetiro=hoy();
  if(o.mandatoFirmado&&!o.fechaMandato)o.fechaMandato=hoy();
  if(o.rentaDiaria&&!o.inicioBono)o.inicioBono=o.fechaPublicacion||o.fechaIngreso||hoy();
  const keep=editing.id?{creadoPor:editing.orig.creadoPor||S.uid||null,creadoEn:editing.orig.creadoEn||new Date().toISOString()}:{creadoPor:S.uid||null,creadoEn:new Date().toISOString()};
  const data={...keep,...o,updatedAt:new Date().toISOString(),updatedBy:S.uid||null};
  const btn=$("#btnSave");btn.disabled=true;btn.textContent="Guardando…";
  try{
    const ref=editing.id?S.db.collection("autos").doc(editing.id):S.db.collection("autos").doc();
    await ref.set(data);
    closeSheet();toast(editing?.id?"Cambios guardados":"Auto guardado");
  }catch(e){btn.disabled=false;btn.textContent="Reintentar";handleWriteErr(e)}
}
function handleWriteErr(e){
  if(e&&e.code==="invalid_argument"&&S.writeProbe!==true){S.canWrite=false;render();toast("No tienes permiso para editar esta tabla")}
  else if(e&&e.code==="quota_exceeded")toast("La base llegó a su límite. Avísale a Luis Francisco.");
  else toast("No se pudo guardar. Revisa tu conexión e inténtalo otra vez.");
}
async function delAuto(btn){
  if(!btn.classList.contains("armed")){btn.classList.add("armed");btn.textContent="Toca otra vez para eliminar";setTimeout(()=>{if(btn.isConnected){btn.classList.remove("armed");btn.textContent="Eliminar"}},4000);return}
  try{await S.db.collection("autos").doc(editing.id).delete();closeSheet();toast("Auto eliminado")}catch(e){handleWriteErr(e)}
}
async function saveWeek(key,btn){
  if(!S.db)return;const o={};document.querySelectorAll(`[data-wk="${key}"]`).forEach(el=>{o[el.dataset.f]=el.type==="number"?(el.value===""?"":Number(el.value)):el.value.trim()});
  o.updatedAt=new Date().toISOString();o.updatedBy=S.uid||null;
  btn.disabled=true;try{await S.db.doc("semanas/"+key).set(o);S.writeProbe=true;toast("Semana guardada")}catch(e){handleWriteErr(e)}finally{btn.disabled=false}
}

}

  },err=>{clearTimeout(timer);setStatus("err","Error al cargar");S.offline="La tabla no se pudo cargar ("+err.code+"). Recarga la página más tarde.";render()});
  db.collection("semanas").onSnapshot(snap=>{const o={};snap.docs.forEach(d=>o[d.id]=d.data());S.semanas=o;if(!snap.metadata.fromCache&&!a2){a2=true;done()}safeRender()},()=>{});
  db.doc("config/equipo").onSnapshot(d=>{S.equipo=(d.exists&&Array.isArray(d.data().miembros))?d.data().miembros:[];safeRender()},()=>{});
  db.collection("pedidos").onSnapshot(onPedSnap,()=>{});
  db.doc("config/criterios").onSnapshot(d=>{S.crit=d.exists?d.data():null;safeRender()},()=>{});
  db.doc("config/virtual").onSnapshot(d=>{S.virtuales=(d.exists&&Array.isArray(d.data().miembros))?d.data().miembros:[];safeRender()},()=>{});
  db.collection("leadsWeb").onSnapshot(snap=>{const prev=S.leadsWeb;S.leadsWeb=snap.docs.map(d=>({...d.data(),_id:d.id}));
    if(prev){const nuevos=S.leadsWeb.filter(l=>!prev.some(p=>p._id===l._id));if(nuevos.length){toast(nuevos.length===1?lwAvisoTxt(nuevos[0]):`${nuevos.length} leads nuevos de consignación`);nuevos.forEach(lwNotificar)}}
    safeRender()},()=>{});
  db.collection("agenda").onSnapshot(snap=>{const prev=S.agenda;S.agenda=snap.docs.map(d=>({...d.data(),_id:d.id}));
    if(prev){const nuevas=S.agenda.filter(c=>!prev.some(p=>p._id===c._id));nuevas.forEach(c=>{toast(`Nueva cita: ${c.nombre||""} · ${agFecha(c.fecha)} ${c.hora} · ${c.auto||""}`);agNotificar(c)})}
    safeRender()},()=>{});
  db.doc("config/agenda").onSnapshot(d=>{S.agCfg=d.exists?d.data():null;safeRender()},()=>{});
  db.collection("pilotoFeedback").onSnapshot(snap=>{S.pfbList=snap.docs.map(d=>({...d.data(),_id:d.id}));safeRender()},()=>{});
  db.collection("radar").onSnapshot(s=>onRadarSnap(s,"radar"),err=>{S.radarErr=err.code;S.radarLoaded=true;safeRender()});
  db.collection("virtual").onSnapshot(s=>onRadarSnap(s,"virtual"),()=>{});
  db.collection("llamadas").onSnapshot(snap=>{S.segPres=snap.docs.map(d=>({...d.data(),_id:d.id}));S.segCalls=[...S.segPres,...S.segVirt];if(!snap.metadata.fromCache)S.segLoaded=true;S.segErr=null;safeRender()},err=>{S.segErr=err.code;S.segLoaded=true;safeRender()});
  db.collection("virtualLlamadas").onSnapshot(snap=>{S.segVirt=snap.docs.map(d=>({...d.data(),_id:d.id,_col:"virtualLlamadas"}));S.segCalls=[...S.segPres,...S.segVirt];safeRender()},()=>{});
  db.collection("segRutina").onSnapshot(snap=>{const o={};snap.docs.forEach(d=>o[d.id]=d.data());S.segRut=o;if(S.view==="seguimiento")safeRender()},()=>{});
  ensureCalls();
})();
})();
</script>

<script>
/* Movimiento estilo Apple: solo presentación, no toca datos ni lógica. */
(function(){
  "use strict";
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  var tabs=document.getElementById("tabs"),main=document.getElementById("main");
  if(!tabs||!main)return;
  // Encabezado que se compacta al hacer scroll
  var onScroll=function(){document.body.classList.toggle("scrolled",scrollY>12)};
  addEventListener("scroll",onScroll,{passive:true});onScroll();
  // Indicador deslizante del control segmentado
  var ind=document.createElement("span");ind.className="tabind";ind.setAttribute("aria-hidden","true");
  tabs.prepend(ind);tabs.classList.add("has-ind");
  function moveInd(){var b=tabs.querySelector('button[aria-selected="true"]:not([hidden])');
    if(!b||tabs.hidden){ind.style.width="0";return}
    ind.style.left=b.offsetLeft+"px";ind.style.width=b.offsetWidth+"px"}
  new MutationObserver(moveInd).observe(tabs,{subtree:true,attributes:true,attributeFilter:["aria-selected","hidden"]});
  addEventListener("resize",moveInd);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(moveInd);
  moveInd();
  if(reduce)return;
  // Aparición al hacer scroll + números que cuentan, solo al cambiar de vista
  var SEL=".kpi,.zone,.panel,.car,.week,.tcard,.rcard,.ptile,.pcar,.sgk,.banner,.fix,.empty";
  var io="IntersectionObserver" in window?new IntersectionObserver(function(es){es.forEach(function(e){
    if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{rootMargin:"0px 0px -6% 0px",threshold:.08}):null;
  function countUp(el){var t=el.textContent.trim(),m=t.match(/^(\$?)([\d.]+)(%?)$/);if(!m)return;
    var n=parseInt(m[2].replace(/\./g,""),10);if(!n||n<2)return;
    var t0=performance.now(),dur=Math.min(1200,500+n*8),fmt=function(v){return m[1]+v.toLocaleString("es-CL")+m[3]};
    (function step(now){var p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=fmt(Math.round(n*e));
      if(p<1&&el.isConnected)requestAnimationFrame(step);else if(el.isConnected)el.textContent=t})(t0)}
  var lastView=null;
  function onRender(){var b=tabs.querySelector('button[aria-selected="true"]'),v=(b&&b.dataset.v)||"";
    if(v===lastView)return;lastView=v;
    main.classList.remove("vt-enter");void main.offsetWidth;main.classList.add("vt-enter");
    var i=0;main.querySelectorAll(SEL).forEach(function(el){
      var r=el.getBoundingClientRect();if(r.top>innerHeight*1.5&&!io){return}
      el.style.setProperty("--d",(Math.min(i++,8)*60)+"ms");el.classList.add("rv");
      if(io)io.observe(el);else el.classList.add("in")});
    main.querySelectorAll(".kpi .v,.sgk .v").forEach(countUp)}
  new MutationObserver(onRender).observe(main,{childList:true});
  onRender();
})();
</script>
